<div id="header">
<h1 class="text-light">OBMC Student Enrollment Form</h1>
<br><br>
<h6 class="text-light">Fill out the form below to enroll for the upcoming school year</h6>
</div>
<br>
<div class="container">
        <div class="enrollment">
            <form>
                <h4>Student Information</h4>
                <div class="row">
                
                    <div class="col-md-6 mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" placeholder="John">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" placeholder="Doe">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Birth Date</label>
                        <input type="date" class="form-control">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Gender</label>
                        <select class="form-select">
                            <option selected disabled>Select...</option>
                            <option>Male</option>
                            <option>Female</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Grade Level</label>
                        <select class="form-select">
                            <option selected disabled>Select...</option>
                            <option>Grade 7</option>
                            <option>Grade 8</option>
                            <option>Grade 9</option>
                            <option>Grade 10</option>
                            <option>Grade 11</option>
                            <option>Grade 12</option>
                        </select>
                    </div>

                </div>

                <h4>Contact Details</h4>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control"
                           placeholder="student@example.com">
                </div>

                <div class="mb-3">
                    <label class="form-label">Contact Number</label>
                    <input type="tel" class="form-control"
                           placeholder="1234-567-8910">
                </div>


                <h4>Other Information</h4>


                <div class="mb-3">

                    <label class="form-label">Mode of Learning</label>

                    <div class="form-check">
                        <input type="radio" class="form-check-input"
                               name="learning" id="online">
                        <label class="form-check-label" for="online">
                            Online
                        </label>
                    </div>

                    <div class="form-check">
                        <input type="radio" class="form-check-input"
                               name="learning" id="face">
                        <label class="form-check-label" for="face">
                            Face-to-face
                        </label>
                    </div>

                </div>

                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="confirm">
                    <label class="form-check-label" for="confirm">
                        I confirm that the information provided is true and complete.
                    </label>
                </div>

                <div class="submit-btn">
                    <button type="submit" class="btn btn-primary btn-lg">
                        Submit Enrollment
                    </button>
                </div>

            </form>

        </div>
    </div>
